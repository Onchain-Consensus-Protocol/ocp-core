[profile.default]
src = "src"
test = "test"
match_path = "test/**"
out = "out"
cache_path = "cache"
solc = "0.8.20"
optimizer = true
optimizer_runs = 1
via_ir = true
remappings = ["forge-std/=lib/forge-std/src/", "@openzeppelin/=lib/openzeppelin-contracts/", "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/", "@prb/math/=lib/prb-math/", "ocp/=lib/ocp-snapshot/src/"]
[profile.default.fuzz]
runs = 256
seed = "0x20261019"

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = true
